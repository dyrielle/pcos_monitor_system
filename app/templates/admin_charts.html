        {% extends "base.html" %}
    {% block content %}

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

    <!-- Simplified Correlation Heatmap (Manuscript Version) -->
    <h3>How Strongly Are These Factors Related?</h3>
    <h5 class="text-muted">Relationship Between PCOS Awareness, Symptoms, and Academic Pressure</h5>

    <div class="row">
        <div class="col-12 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-light">
                    <strong>Correlation Strength Between Main Factors</strong>
                </div>
                <div class="card-body">
                    <div id="simple_correlation_heatmap" style="width:100%;height:400px;"></div>
                </div>
            </div>
        </div>
    </div>

    <a href="{{ url_for('admin.admin_home') }}" class="btn btn-secondary mt-4">Back to Admin Panel</a>

    <script>
    // ----- SIMPLIFIED CORRELATION HEATMAP (Manuscript Version) -----
    const simpleCorrLabels = {{ simple_corr_labels | tojson }};
    const simpleCorrValues = {{ simple_corr_values | tojson }};

    if (simpleCorrLabels && simpleCorrLabels.length > 0 && simpleCorrValues && simpleCorrValues.length > 0) {
        // Create masked values for lower triangle only (easier to read)
        const maskedValues = simpleCorrValues.map((row, i) => 
            row.map((val, j) => (j > i ? null : val))
        );
        
        // Create text annotations with larger, clearer values
        const textAnnotations = simpleCorrValues.map((row, i) => 
            row.map((val, j) => {
                if (j > i) return '';  // Hide upper triangle
                if (i === j) return '1.00';  // Diagonal always 1
                return val.toFixed(2);  // Show correlation value
            })
        );

        // Create a more intuitive color scheme
        // Stronger correlations = darker colors, weaker = lighter
        const simpleHeatmapData = [{
            z: maskedValues,
            x: simpleCorrLabels,
            y: simpleCorrLabels,
            type: 'heatmap',
            colorscale: [
                [0, '#fee5d9'],      // Very light orange (weak positive)
                [0.3, '#fcbba1'],    // Light orange
                [0.5, '#fc9272'],    // Medium orange
                [0.7, '#fb6a4a'],    // Strong orange
                [0.85, '#de2d26'],   // Very strong orange-red
                [1, '#a50f15']       // Maximum correlation (dark red)
            ],
            zmin: 0,   // We only show positive correlations in this dataset
            zmax: 1,
            colorbar: {
                title: {
                    text: '<b>Correlation<br>Strength</b>',
                    side: 'right',
                    font: { size: 12 }
                },
                tickvals: [0, 0.25, 0.5, 0.75, 1.0],
                ticktext: ['Weak<br>0.00', '0.25', 'Moderate<br>0.50', '0.75', 'Strong<br>1.00'],
                tickfont: { size: 10 },
                len: 0.7
            },
            text: textAnnotations,
            texttemplate: '<b>%{text}</b>',
            textfont: {
                size: 16,
                family: 'Arial, sans-serif',
                color: 'black'
            },
            hovertemplate: '<b>%{y} ↔ %{x}</b><br>Correlation: %{z:.2f}<br><i>%{z:.0%} relationship strength</i><extra></extra>',
            showscale: true,
            hoverongaps: false
        }];

        const simpleHeatmapLayout = {
            title: '',
            xaxis: {
                title: '',
                tickangle: -35,
                side: 'bottom',
                tickfont: { size: 12, family: 'Arial, sans-serif' },
                showgrid: false
            },
            yaxis: {
                title: '',
                autorange: 'reversed',
                tickfont: { size: 12, family: 'Arial, sans-serif' },
                showgrid: false
            },
            margin: {
                l: 200,
                r: 150,
                t: 20,
                b: 150
            },
            plot_bgcolor: '#ffffff',
            paper_bgcolor: '#ffffff'
        };

        const simpleHeatmapConfig = {
            responsive: true,
            displayModeBar: true,
            displaylogo: false,
            modeBarButtonsToRemove: ['pan2d', 'lasso2d', 'select2d', 'zoom2d', 'autoScale2d']
        };

        Plotly.newPlot('simple_correlation_heatmap', simpleHeatmapData, simpleHeatmapLayout, simpleHeatmapConfig);
    } else {
        document.getElementById('simple_correlation_heatmap').innerHTML = 
            '<div class="text-center text-muted p-5">Not enough data to generate correlation heatmap. Need at least 2 data points.</div>';
    }
    </script>

    {% endblock %}
